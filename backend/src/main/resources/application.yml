server:
  port: 8080

spring:
  application:
    name: leave-management
  profiles:
    active: default
  datasource:
    url: jdbc:h2:mem:leavedb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

leave:
  annual-quota-default: 24
  escalation-timeout-minutes: 1
  escalation-check-seconds: 30
  conflict-threshold: 0.30
  conflict:
    threshold-low: 0.30
    threshold-medium: 0.50
    threshold-high: 0.70
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    expiration-ms: 86400000

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:leavedb}
    username: ${DB_USER:leaveuser}
    password: ${DB_PASSWORD:leavepass}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
